<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@edinstvo/glass bench</title>
<link rel="stylesheet" href="/css/glass.css">
<link rel="stylesheet" href="/demo/bench.css">
<canvas id="scene"></canvas>
<main>
  <edinstvo-glass id="card" class="card" source="#scene" thickness="24" depth="18"
    refraction="0.85" frost="0.15" transparency="0.98" lift="0"></edinstvo-glass>
  <edinstvo-glass class="pill" source="#scene" thickness="18" depth="12" refraction="0.8"
    dispersion="0.45" frost="0.25" transparency="0.98" lift="0" appear>Glass</edinstvo-glass>
  <edinstvo-glass-group id="group" source="#scene" transparency="0.99" lift="0" refraction="0.55" depth="18" dispersion="0.3" rim="0.5">
    <edinstvo-glass class="blob" id="a" source="#scene" merge="28"></edinstvo-glass>
    <edinstvo-glass class="blob" id="b" source="#scene" style="left:170px" merge="28"></edinstvo-glass>
    <edinstvo-glass class="blob wide" id="c" source="#scene" style="left:340px"></edinstvo-glass>
  </edinstvo-glass-group>
</main>
<div id="controls"></div>
<script type="module">
  import "/dist/define.js";
  import { inspectScene } from "/demo/inspector.js";

  const scene = document.querySelector("#scene");
  const surfaces = document.querySelectorAll("edinstvo-glass, edinstvo-glass-group");
  const paint = () => {
    scene.width = innerWidth * 2;
    scene.height = innerHeight * 2;
    const c = scene.getContext("2d");
    const sky = c.createLinearGradient(0, 0, scene.width, scene.height);
    sky.addColorStop(0, "#E54D33");
    sky.addColorStop(0.5, "#f2b134");
    sky.addColorStop(1, "#1d4ed8");
    c.fillStyle = sky;
    c.fillRect(0, 0, scene.width, scene.height);
    c.strokeStyle = "#fff";
    c.lineWidth = 3;
    c.beginPath();
    for (let x = 0; x < scene.width; x += 64) {
      c.moveTo(x, 0);
      c.lineTo(x, scene.height);
    }
    for (let y = 0; y < scene.height; y += 64) {
      c.moveTo(0, y);
      c.lineTo(scene.width, y);
    }
    c.stroke();
    c.fillStyle = "#111";
    c.font = "600 176px sans-serif";
    c.textAlign = "center";
    c.fillText("Единство", scene.width / 2, scene.height / 2);
    for (const surface of surfaces) surface.invalidate();
  };
  paint();
  addEventListener("resize", paint);

  for (const blob of document.querySelectorAll(".blob")) {
    let from = null;
    blob.addEventListener("pointerdown", (e) => { from = [e.clientX - blob.offsetLeft, e.clientY - blob.offsetTop, e.clientX]; blob.setPointerCapture(e.pointerId); });
    blob.addEventListener("pointermove", (e) => { if (from) { blob.style.left = `${e.clientX - from[0]}px`; blob.style.top = `${e.clientY - from[1]}px`; } });
    blob.addEventListener("pointerup", (e) => { if (from && Math.abs(e.clientX - from[2]) < 4) blob.classList.toggle("open"); from = null; });
  }
  inspectScene(document.querySelector("main"), document.querySelector("#controls"));
</script>
</html>
